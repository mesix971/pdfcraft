[package]
name = "pdfcraft-ai"
description = "The optional AI assistant: summarize, ask about and translate a document with the user's own Anthropic API key (off until a key is set)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"

# One HTTPS request per question, over rustls with the operating system's trusted roots. No
# bundled root list (webpki-roots and webpki-root-certs are CDLA-licensed), as for the desktop
# app's update check. Not in the web build: a browser page can't call the API with a key.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-pki-types = { version = "1", features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rustls-native-certs = "0.8"
