[package]
name = "pdfcraft-ai"
description = "The optional AI assistant: summarize, ask about, translate and correct a document with the service the user chooses (Claude, ChatGPT, Gemini or any OpenAI-compatible one) and the user's own key, off until it is set up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"

# One HTTPS request per question, over rustls with the operating system's trusted roots. No
# bundled root list (webpki-roots and webpki-root-certs are CDLA-licensed), as for the desktop
# app's update check. Not in the web build: a browser page can't call the API with a key.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-pki-types = { version = "1", features = ["std"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rustls-native-certs = "0.8"
